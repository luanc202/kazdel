volumes:
  cache:
    driver: local
  cache-test:
    driver: local
networks:
  shorturl-dev:
    driver: bridge
  shorturl-integration-tests:
    driver: bridge

services:
  api:
    image: cosmtrek/air
    profiles:
      - development
    hostname: api
    working_dir: /app
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}?sslmode=disable
      - PORT=${PORT}
      - ENVIRONMENT=${ENVIRONMENT}
      - MIGRATIONS_PATH=${MIGRATIONS_PATH}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./:/app
    depends_on:
      cache:
        condition: service_started
      db:
        condition: service_started
    env_file:
      - .env
    networks:
      - shorturl-dev

  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - production
    environment:
      - DATABASE_URL
      - PORT
      - ENVIRONMENT
      - MIGRATIONS_PATH
      - JWT_SECRET
    depends_on:
      cache:
        condition: service_started
      db:
        condition: service_started
    networks:
      - shorturl-dev

  db: &db
    image: postgres:18.1-alpine
    profiles:
      - development
      - production
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PORT=${DB_PORT}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    depends_on:
      cache:
        condition: service_started
    volumes:
      - ./psql_data:/var/lib/postgresql
    env_file:
      - .env
    networks:
      - shorturl-dev

  cache: &cache
    image: redis:7.2.4-alpine
    profiles:
      - development
      - production
    hostname: shorturl-cache
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --save "" --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./cache:/data
    env_file:
      - .env
    networks:
      - shorturl-dev

  api-test:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - integration-tests
    hostname: api-tests
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      ENVIRONMENT: ${ENVIRONMENT}
      MIGRATIONS_PATH: ${MIGRATIONS_PATH}
      INTEGRATION: true
    depends_on:
      cache-test:
        condition: service_healthy
      db-test:
        condition: service_healthy
    env_file:
      - .env.example
    networks:
      - shorturl-integration-tests

  cache-test:
    <<: *cache
    profiles:
      - integration-tests
    hostname: cache-test
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      start_period: 1m
      interval: 1m
      timeout: 10s
      retries: 3
    volumes:
      - ./cache:/data-teste
    env_file:
      - .env.example
    networks:
      - shorturl-integration-tests

  db-test:
    <<: *db
    depends_on:
      cache-test:
        condition: service_healthy
    profiles:
      - integration-tests
    hostname: db-test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      start_period: 1m
      interval: 1m
      timeout: 10s
      retries: 3
    volumes:
      - ./data-teste:/var/lib/postgresql/data
    env_file:
      - .env.example
    networks:
      - shorturl-integration-tests
